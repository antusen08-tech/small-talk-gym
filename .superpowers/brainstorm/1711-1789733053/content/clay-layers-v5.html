/* LAYER 1: outer slab, floats highest above background */

.traywrap{position:relative;margin-bottom:18px}

/* LAYER 3: rows raised ABOVE the tray surface — highest local elevation */
.rows3{display:flex;flex-direction:column;gap:10px}
.row3{display:flex;align-items:center;gap:11px;background:#fff;border-radius:16px;padding:11px 12px;

.row3.done{background:linear-gradient(160deg,#6c8cf0,#4364c9);box-shadow:0 3px 0 #2f4694, 0 14px 22px rgba(30,50,120,.4), inset 0 1px 0 rgba(255,255,255,.3)}
.row3.done .t{color:#fff}
.row3.done .d{color:#dbe6ff}
.row3 .icon3{width:32px;height:32px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;
  box-shadow:0 3px 0 rgba(0,0,0,.18), 0 6px 10px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.55)}
.icon3.green{background:linear-gradient(160deg,#6bd08f,#3fae67)}
.icon3.red{background:linear-gradient(160deg,#f78a8a,#e35a5a)}
.icon3.blue{background:linear-gradient(160deg,#7d9df0,#5b7fe0)}
.row3 .t{font-size:12.5px;font-weight:800;color:#20345e}
.row3 .d{font-size:10px;color:#7c8fbd;font-weight:600}
.row3 .x{margin-left:auto;width:24px;height:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;color:#4364c9;

.row3.done .x{background:#eaf1ff}

/* LAYER 4: bottom buttons — same elevation family as rows but wider */
.btnrow3{display:flex;gap:10px;margin-top:18px}
