<style>
.phoneframe{width:300px;border-radius:46px;padding:14px;background:#1a1a1a;box-shadow:0 30px 60px -20px rgba(0,0,0,.35)}

.simhead .t{font-size:14px;font-weight:800;color:#5c3d1f}
.scenecard{background:linear-gradient(160deg,#fff,#fff6ea);border-radius:20px;padding:11px 14px;margin-bottom:12px;box-shadow:0 8px 18px rgba(0,0,0,.10), inset 0 1px 0 rgba(255,255,255,.6);font-size:11px;color:#8a6a45;line-height:1.6}
.scenecard b{color:#5c3d1f}
.bubblewrap{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.bubble{max-width:78%;padding:10px 13px;border-radius:18px;font-size:12.5px;line-height:1.5;box-shadow:0 6px 14px rgba(0,0,0,.10)}
.bubble.them{align-self:flex-start;background:#fff;color:#5c3d1f;border-bottom-left-radius:6px}
.bubble.me{align-self:flex-end;background:linear-gradient(160deg,#e2a45f,#c97f34);color:#fff;border-bottom-right-radius:6px}
.hint{align-self:center;font-size:10px;color:#a3835f;background:#fff6ea;padding:4px 12px;border-radius:12px}
.turnrow{display:flex;gap:7px}
.turnbtn{flex:1;text-align:center;font-size:10.5px;font-weight:700;padding:9px 3px;border-radius:14px;box-shadow:0 6px 12px rgba(0,0,0,.10)}

.tabbar{background:rgba(255,255,255,.75);backdrop-filter:blur(6px);margin:0 10px 10px;border-radius:22px;display:flex;justify-content:space-around;padding:10px 4px 8px;box-shadow:0 -6px 16px rgba(0,0,0,.06), 0 6px 14px rgba(0,0,0,.08)}

.homeindicator{width:110px;height:4px;background:#1a1a1a;border-radius:3px;margin:8px auto 2px}
